name: Bot ORB (paper)

# Depuis le 20/10/2026 (variante A) : UN SEUL déclencheur, externe (cron-job.org), qui appelle
# « workflow_dispatch » deux fois par jour de bourse : vers 9:00 NY (sélection + phase A)
# et vers 12:50 NY (surveillance jusqu'à 15:55, fermeture, journal).
# Les créneaux planifiés GitHub (« schedule ») ont été retirés : ils doublonnaient cron-job.org
# et produisaient des dizaines de lancements annulés par jour.
on:
  workflow_dispatch: {}       # bouton « Run workflow » pour un lancement manuel

concurrency:
  group: orb-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: pip install -q alpaca-py pandas
      - name: Lancer le bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot_live.py
      - name: Enregistrer le journal
        if: always()
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          for f in state.json trades.csv JOURNAL.md README.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Journal $(date -u +%Y-%m-%d_%H%M)"
            git pull --rebase
            git push
          fi
      - name: Relancer la phase suivante
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .dispatch_next ]; then gh workflow run bot.yml --ref main; fi
