name: Bot ORB (paper)

# Heures en UTC. Le script regarde lui-même l'heure de New York et sait quoi faire.
on:
  schedule:
    # Démarrage entre 8:00 et 9:30 (heure de New York), plusieurs créneaux car GitHub
    # retarde parfois les lancements planifiés. Le premier qui démarre attend 9:35 NY ;
    # les suivants voient que la journée est déjà en cours.
    # Heure d'été NY (UTC-4) : 12:03 → 8:03 … 13:23 → 9:23 · heure d'hiver (UTC-5) : 13:03 → 8:03 … 14:23 → 9:23
    - cron: "3 12 * * 1-5"
    - cron: "23 12 * * 1-5"
    - cron: "43 12 * * 1-5"
    - cron: "3 13 * * 1-5"
    - cron: "23 13 * * 1-5"
    - cron: "43 13 * * 1-5"
    - cron: "3 14 * * 1-5"
    - cron: "23 14 * * 1-5"
    - cron: "41 16 * * 1-5"   # ≈ 12:41 NY (été) → surveillance jusqu'à 15:55, fermeture, journal
    - cron: "41 17 * * 1-5"   # ≈ 12:41 NY (hiver)
  workflow_dispatch: {}       # bouton « Run workflow » pour un lancement manuel

concurrency:
  group: orb-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: pip install -q alpaca-py pandas
      - name: Lancer le bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot_live.py
      - name: Enregistrer le journal
        if: always()
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          for f in state.json trades.csv JOURNAL.md README.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Journal $(date -u +%Y-%m-%d_%H%M)"
            git pull --rebase
            git push
          fi
      - name: Relancer la phase suivante
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .dispatch_next ]; then gh workflow run bot.yml --ref main; fi
