name: Bot ORB (paper)

# Heures en UTC. Deux créneaux par phase pour couvrir l'heure d'été ET l'heure d'hiver de New York :
# le script regarde lui-même l'heure de New York et sait quoi faire.
on:
  schedule:
    # Plusieurs créneaux le matin : GitHub retarde parfois les lancements planifiés.
    # Le premier qui démarre attend 9:35 NY ; les suivants voient que la journée est déjà en cours.
    - cron: "7 12 * * 1-5"    # ≈ 8:07 NY (été) / 7:07 NY (hiver)
    - cron: "37 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "14 13 * * 1-5"   # ≈ 9:14 NY (été)
    - cron: "14 14 * * 1-5"   # ≈ 9:14 NY (hiver)
    - cron: "41 16 * * 1-5"   # ≈ 12:41 NY (été) → surveillance jusqu'à 15:55, fermeture, journal
    - cron: "41 17 * * 1-5"   # ≈ 12:41 NY (hiver)
  workflow_dispatch: {}       # bouton « Run workflow » pour un lancement manuel

concurrency:
  group: orb-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: pip install -q alpaca-py pandas
      - name: Lancer le bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot_live.py
      - name: Enregistrer le journal
        if: always()
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          for f in state.json trades.csv JOURNAL.md README.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Journal $(date -u +%Y-%m-%d_%H%M)"
            git pull --rebase
            git push
          fi
      - name: Relancer la phase suivante
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .dispatch_next ]; then gh workflow run bot.yml --ref main; fi
